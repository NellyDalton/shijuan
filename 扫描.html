<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>智批 AI V11.3（自动拼图合并版）</title>
    <link rel="stylesheet" href="assets/grader/styles.css">

</head>

<body>

<header>
  <div style="display:flex; gap:10px; align-items:center">
    <div class="brand">🦉 智批 AI V11.3</div>
    <div class="pill" id="keyState">Key：未设置</div>
    <div class="pill">题图：<span id="promptState">未设置</span></div>
    <div class="pill">队列：<span id="qState">0</span> | 完成：<span id="doneState">0</span></div>
  </div>

  <div class="top-actions">
    <button class="btn-ghost btn" id="btnToggleLeft">🪟 左侧图片区</button>
    <button class="btn-ghost btn" id="btnKey">🔑 设置Key</button>
    <button class="btn-ghost btn" id="btnPromptImg">🖼️ 上传题图</button>
    <button class="btn" id="btnUpload">📷 批量上传作文</button>
    <button class="btn-ghost btn" id="btnStart">▶ 开始批改</button>
    <button class="btn-ghost btn" id="btnDebug">🧪 调试</button>
  </div>
</header>

<main>
  <div class="left" id="leftPane">
    <div class="viewport" id="viewport">
      <div class="canvas-wrapper" id="wrapper">
        <img id="essayImg" alt="">
        <canvas id="overlayCanvas"></canvas>
        <div id="focusBox"></div>
      </div>
      <div class="empty" id="empty">
        <div class="big">📄</div>
        <div class="sub">UPLOAD ESSAYS</div>
        <div class="hint" style="margin-top:10px; color:#666">支持多页自动合并 (如 1.1.jpg, 1.2.jpg)</div>
      </div>
    </div>
  </div>

  <div class="right">
    <div class="tabbar">
      <div class="tab active" data-tab="queue">队列</div>
      <div class="tab" data-tab="result">结果</div>
      <div class="tab" data-tab="settings">设置</div>
      <div class="tab" data-tab="export">导出</div>
      <div class="spacer"></div>
      <div class="right-actions">
        <button class="btn-ghost btn" id="btnSelectNext">⏭ 下一篇</button>
        <button class="btn-ghost btn" id="btnSelectPrev">⏮ 上一篇</button>
      </div>
    </div>

    <div class="panel" id="panelQueue"></div>
    <div class="panel" id="panelResult" style="display:none"></div>
    <div class="panel" id="panelSettings" style="display:none"></div>
    <div class="panel" id="panelExport" style="display:none"></div>
  </div>
</main>

<input id="essayFiles" type="file" accept="image/*" multiple style="display:none"/>
<input id="promptFile" type="file" accept="image/*" style="display:none"/>

<div class="modal" id="keyModal">
  <div class="modal-box">
    <h3 class="modal-title">🔐 设置智谱 API Key</h3>
    <div class="modal-sub">
      Key 仅保存在本地浏览器（sessionStorage）。关闭页面会清空。<br/>
      如果你在公共电脑用，建议用完就关掉页面。
    </div>
    <input id="keyInput" type="text" placeholder="sk-..." style="margin-top:12px"/>
    <div class="modal-actions">
      <button class="btn-ghost btn" id="btnKeyCancel">取消</button>
      <button class="btn" id="btnKeySave">保存</button>
    </div>
  </div>
</div>

<div class="debug" id="debugPanel">
  <div class="debug-head">
    <div>🧪 调试面板（最近一次请求/返回）</div>
    <div style="display:flex; gap:8px">
      <button class="btn-ghost btn" id="btnCopyReq">复制请求体</button>
      <button class="btn-ghost btn" id="btnCopyRes">复制返回</button>
      <button class="btn-ghost btn" id="btnCloseDbg">关闭</button>
    </div>
  </div>
  <div class="debug-body">
    <div class="hint" style="margin-bottom:6px">请求体：</div>
    <pre id="dbgReq"></pre>
    <div class="divider"></div>
    <div class="hint" style="margin-bottom:6px">返回：</div>
    <pre id="dbgRes"></pre>
  </div>
</div>

<script src="assets/grader/app.js"></script>
</body>
</html>
