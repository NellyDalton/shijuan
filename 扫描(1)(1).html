<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全班作业扫描王</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
      <link rel="stylesheet" href="assets/scanner/styles.css">

</head>
<body>

<div class="header">
    <div class="stats">
        已存库: <b id="totalSaved">0</b> 人<br>
        <span style="opacity:0.6">内存占用 ≈ <span id="memUsage">0</span> MB</span>
    </div>
    <button class="btn-export" id="btnExport" disabled>
        <span>📦 打包全班</span>
    </button>
</div>

<div id="cam-container">
    <video id="video" autoplay playsinline></video>
    <div class="current-hud">当前: 学生 <span id="currId" style="font-size:1.3em; color:#fff">1</span> (第 <span id="currPage">0</span> 页)</div>
    <div class="flash" id="flash"></div>
    <div class="preview-box" id="previewBox">
        <img id="previewImg">
        <div class="page-badge" id="previewBadge">0页</div>
    </div>
</div>

<div class="controls">
    <button class="side-btn" id="btnUndoLast">
        <div class="icon-circle">↺</div>
        <span>撤销本页</span>
    </button>

    <div class="shutter-ring" id="btnSnap">
        <div class="shutter-inner"></div>
    </div>

    <button class="side-btn btn-next" id="btnNextStudent">
        <div class="icon-circle">➜</div>
        <span>完成此人<br>下一位</span>
    </button>
</div>

<div id="loading">
    <div class="spinner"></div>
    <div style="margin-top:15px; font-weight:bold">正在压缩打包...</div>
    <div style="font-size:12px; color:#aaa; margin-top:5px">请不要关闭页面</div>
</div>

<canvas id="canvas" style="display:none"></canvas>

<script src="assets/scanner/app.js"></script>
</body>
</html>
